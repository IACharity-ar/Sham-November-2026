/* ==================================================
   SPLASH
================================================== */
.splash{
  position:fixed;
  z-index:50000;
  inset:0;

  display:flex;
  align-items:center;
  justify-content:center;

  background:
    radial-gradient(
      circle at center,
      #087646,
      #003b21 58%,
      #002515
    );

  transition:
    opacity .7s ease,
    visibility .7s ease;
}

.splash.hide{
  opacity:0;
  visibility:hidden;
  pointer-events:none;
}

.splash-content{
  display:flex;
  flex-direction:column;
  align-items:center;
  text-align:center;
}

.logo-animation{
  position:relative;
  width:150px;
  height:150px;
  margin-bottom:25px;
}

.logo-half{
  position:absolute;
  top:0;
  width:75px;
  height:150px;
  overflow:hidden;
  opacity:0;
  filter:drop-shadow(0 15px 30px rgba(0,0,0,.25));
}

.logo-half img{
  position:absolute;
  top:0;
  width:150px;
  height:150px;
  object-fit:cover;
  border-radius:50%;
}

.logo-left{
  left:0;
  transform:translateX(-80px);
  animation:logoLeft .9s .15s forwards cubic-bezier(.2,.8,.2,1);
}

.logo-left img{
  left:0;
}

.logo-right{
  right:0;
  transform:translateX(80px);
  animation:logoRight .9s .15s forwards cubic-bezier(.2,.8,.2,1);
}

.logo-right img{
  right:0;
}

@keyframes logoLeft{
  to{
    transform:translateX(0);
    opacity:1;
  }
}

@keyframes logoRight{
  to{
    transform:translateX(0);
    opacity:1;
  }
}

.logo-ring{
  position:absolute;
  inset:-10px;
  border:1px solid rgba(255,255,255,.28);
  border-radius:50%;
  opacity:0;
  animation:ringShow .8s .85s forwards;
}

.logo-ring::after{
  content:"";
  position:absolute;
  inset:-10px;
  border:1px solid rgba(255,255,255,.10);
  border-radius:50%;
}

@keyframes ringShow{
  from{
    opacity:0;
    transform:scale(.75);
  }

  to{
    opacity:1;
    transform:scale(1);
  }
}

.splash-title{
  color:white;
  font-size:21px;
  font-weight:800;
  opacity:0;
  transform:translateY(15px);
  animation:splashText .6s .9s forwards;
}

.splash-campaign{
  margin-top:6px;
  color:rgba(255,255,255,.66);
  font-size:11px;
  letter-spacing:1px;
  opacity:0;
  animation:splashText .6s 1.15s forwards;
}

.splash-line{
  width:0;
  height:2px;
  margin-top:17px;
  border-radius:10px;
  background:rgba(255,255,255,.8);
  animation:splashLine .7s 1.25s forwards;
}

@keyframes splashText{
  to{
    opacity:1;
    transform:translateY(0);
  }
}

@keyframes splashLine{
  to{
    width:100px;
  }
}


/* ==================================================
   WELCOME SCREEN
================================================== */

.welcome-screen{
  position:fixed;
  z-index:40000;
  inset:0;

  display:none;
  align-items:center;
  justify-content:center;

  padding:25px;

  overflow:auto;

  background:
    radial-gradient(
      circle at 20% 15%,
      rgba(0,150,84,.18),
      transparent 30%
    ),
    radial-gradient(
      circle at 80% 80%,
      rgba(0,104,56,.15),
      transparent 32%
    ),
    linear-gradient(
      145deg,
      #f7fcf9,
      #eaf7f0
    );

  opacity:0;
  transition:opacity .6s ease;
}

.welcome-screen.show{
  display:flex;
  opacity:1;
}

.welcome-screen.leave{
  opacity:0;
  pointer-events:none;
}

.welcome-decoration{
  position:absolute;
  border-radius:50%;
  pointer-events:none;
}

.welcome-decoration.one{
  width:250px;
  height:250px;
  top:-100px;
  right:-70px;
  border:40px solid rgba(0,104,56,.04);
}

.welcome-decoration.two{
  width:200px;
  height:200px;
  bottom:-80px;
  left:-50px;
  border:30px solid rgba(0,150,84,.05);
}

.welcome-card{
  position:relative;
  z-index:2;

  width:min(600px,100%);

  padding:42px 35px 32px;

  border:1px solid rgba(0,104,56,.10);
  border-radius:30px;

  background:rgba(255,255,255,.88);

  backdrop-filter:blur(15px);

  box-shadow:
    0 30px 80px
    rgba(0,70,38,.12);

  text-align:center;

  animation:welcomeUp .8s ease;
}

@keyframes welcomeUp{
  from{
    opacity:0;
    transform:translateY(25px) scale(.97);
  }

  to{
    opacity:1;
    transform:translateY(0) scale(1);
  }
}

.welcome-logo-wrap{
  position:relative;

  width:115px;
  height:115px;

  margin:0 auto 22px;
}

.welcome-logo-glow{
  position:absolute;
  inset:-15px;

  border-radius:50%;

  background:
    rgba(0,150,84,.10);

  animation:
    welcomePulse
    2.4s ease-in-out infinite;
}

@keyframes welcomePulse{
  50%{
    transform:scale(1.08);
    opacity:.5;
  }
}

.welcome-logo{
  position:relative;
  z-index:2;

  width:115px;
  height:115px;

  object-fit:cover;

  border-radius:50%;

  border:4px solid white;

  box-shadow:
    0 15px 35px
    rgba(0,80,44,.18);
}

.welcome-mini{
  color:var(--green);

  font-size:10px;
  font-weight:800;

  letter-spacing:1.4px;
}

.welcome-title{
  margin-top:8px;

  font-size:23px;
  font-weight:800;
}

.welcome-divider{
  width:50px;
  height:3px;

  margin:16px auto;

  border-radius:20px;

  background:
    linear-gradient(
      90deg,
      var(--green),
      var(--green2)
    );
}

.welcome-quote-ar{
  min-height:38px;

  font-size:16px;
  font-weight:800;
  line-height:1.9;

  color:var(--dark);
}

.welcome-quote-en{
  min-height:34px;

  margin-top:8px;

  direction:ltr;

  color:var(--muted);

  font-family:"Inter",sans-serif;

  font-size:12px;
  line-height:1.7;
}

.welcome-button{
  width:100%;

  margin-top:25px;

  padding:15px 20px;

  border:0;
  border-radius:15px;

  color:white;

  background:
    linear-gradient(
      135deg,
      var(--dark),
      var(--green2)
    );

  font-size:12px;
  font-weight:800;

  box-shadow:
    0 10px 25px
    rgba(0,104,56,.18);
}

.welcome-countdown{
  margin-top:13px;

  color:var(--muted);

  font-size:9px;

        autoEnter: seconds => 'الدخول تلقائيًا بعد ' + seconds + ' ثانية'
      },
      en: {
        organization: 'International Aid Campaign', navigation: 'Sections',
        delivery: 'Delivery', search: 'Search', stats: 'Statistics', lock: 'Lock',
        access: 'Distribution team access', accessIntro: 'Enter the team key to access distribution records.',
        key: 'Team key', unlock: 'Continue', id: 'Beneficiary ID',
        deliveryIntro: 'Scan a QR code or enter an ID, then review the record before confirming delivery.',
        lookup: 'Look up', scan: 'Scan QR', stopScan: 'Stop camera',
        searchIntro: 'Search by ID, name, partner name, phone or address.',
        query: 'Search term', previous: 'Previous', next: 'Next', refresh: 'Refresh',
        name: 'Name', partner: 'Partner name', phone: 'Phone', members: 'Household members', address: 'Address',
        status: 'Delivery status', delivered: 'Delivered', pending: 'Pending',
        unknown: 'Status needs review', total: 'Total records', rate: 'Delivery rate',
        confirm: 'Confirm delivery', loading: 'Loading…', startingCamera: 'Starting camera…',
        scanHint: 'Point the camera at the QR code.',
        cameraError: 'Could not start the camera. Check permission or enter the ID manually.',
        cameraContext: 'The camera requires HTTPS. You can enter the ID manually.',
        cameraLibrary: 'Could not load the QR reader. You can enter the ID manually.',
        invalid_qr: 'The QR code did not contain a single valid ID. Scan again or enter the ID manually.',
        invalid_id: 'Enter an ID in the format NOV0001 or SHAM-N001.',
        not_found: 'No beneficiary was found for this ID.',
        duplicate_id: 'This ID is duplicated in the sheet. Review the records before delivery.',
        unknown_status: 'Review the Delivered cell in the sheet before recording delivery.',
        invalid_query: 'Enter at least two characters to search.',
        unauthorized: 'Check the team key and try again.',
        configuration: 'Set SPREADSHEET_ID and ACCESS_KEY in Apps Script properties.',
        endpoint: 'Set API_URL in index.html to the deployed Apps Script /exec URL.',
        schema: 'Check the tab ID and first-row column headers.',
        busy: 'Delivery is busy. Please retry.',
        server: 'The request failed. Check the Apps Script execution log.',
        network: 'Could not reach the distribution service. Check the URL and deployment settings and retry.',
        noResults: 'No matching records.', count: 'Results', saved: 'Delivery recorded.',
        already: 'Delivery was already recorded for this beneficiary.', welcomeButton: 'Enter the system',
        autoEnter: seconds => 'Entering automatically in ' + seconds + ' seconds'
      }
    };

    const $ = id => document.getElementById(id);
    const views = ['delivery', 'search', 'stats'];
    const idPattern = /^(?:NOV\d{4,}|SHAM-N\d{3,})$/;
    let language = 'ar';
    let key = '';
    let session = 0;
    let activeView = 'delivery';
    let currentPerson = null;
    let searchState = null;
    let query = '';
    let currentStats = null;
    let deliveryBusy = false;
    let searchBusy = false;
    let statsBusy = false;
    let camera = null;
    let welcomeTimer;

    function t(code) {
      return labels[language][code] || labels[language].server;
    }

    function element(tag, text, className) {
      const node = document.createElement(tag);
      if (text != null) node.textContent = text;
      if (className) node.className = className;
      return node;
    }

    function notice(id, code = '', kind = '', value = '') {
      const node = $(id + '-notice');
      node.dataset.code = code;
      node.dataset.kind = kind;
      node.dataset.value = value;
      node.textContent = code ? t(code) + (value === '' ? '' : ' · ' + value) : '';
    }

    function applyLanguage() {
      document.documentElement.lang = language;
      document.documentElement.dir = language === 'ar' ? 'rtl' : 'ltr';
      document.querySelectorAll('[data-text]').forEach(node => {
        node.textContent = t(node.dataset.text);
      });
      document.querySelector('.navigation').setAttribute('aria-label', t('navigation'));
      $('language').textContent = language === 'ar' ? 'English' : 'العربية';
      $('language').lang = language === 'ar' ? 'en' : 'ar';
      document.querySelectorAll('.notice').forEach(node => {
        notice(node.id.replace('-notice', ''), node.dataset.code, node.dataset.kind, node.dataset.value);
      });
      renderDelivery();
      renderSearch();
      renderStats();
    }

    function startWelcome() {
      const quote = welcomeQuotes[Math.floor(Math.random() * welcomeQuotes.length)];
      $('welcomeQuoteAr').textContent = quote.ar;
      $('welcomeQuoteEn').textContent = quote.en;
      setTimeout(() => {
        $('welcomeScreen').classList.add('show');
        $('splash').classList.add('hide');
        let seconds = 15;
        $('welcomeCountdown').textContent = t('autoEnter')(seconds);
        welcomeTimer = setInterval(() => {
          seconds--;
          $('welcomeCountdown').textContent = t('autoEnter')(seconds);
          if (!seconds) enterSystem();
        }, 1000);
      }, 2100);
    }

    function enterSystem() {
      clearInterval(welcomeTimer);
      $('welcomeScreen').classList.add('leave');
      setTimeout(() => {
        $('welcomeScreen').hidden = true;
        $('app').hidden = false;
        $('access').showModal();
      }, 600);
    }

    function lockApp(code = '') {
      session++;
      key = '';
      stopCamera();
      currentPerson = searchState = currentStats = null;
      deliveryBusy = searchBusy = statsBusy = false;
      $('manual-id').value = $('search-query').value = query = '';
      views.forEach(view => notice(view));
      renderDelivery();
      renderSearch();
      renderStats();
      $('access-key').value = '';
      notice('access', code, 'error');
      if (!$('access').open) $('access').showModal();
    }

    async function api(action, params = {}, requestKey = key) {
      if (!/^https:\/\/script\.google\.com\/macros\/s\/[\w-]+\/exec$/.test(API_URL)) {
        throw new Error('endpoint');
      }
      const controller = new AbortController();
      const timeout = setTimeout(() => controller.abort(), 25000);
      let payload;
      try {
        const response = await fetch(API_URL, {
          method: 'POST',
          headers: {'Content-Type': 'text/plain;charset=UTF-8'},
          body: JSON.stringify({...params, action, key: requestKey}),
          credentials: 'omit',
          signal: controller.signal
        });
        if (!response.ok) throw new Error('HTTP ' + response.status);
        payload = await response.json();
      } catch (error) {
        throw new Error('network');
      } finally {
        clearTimeout(timeout);
      }
      if (!payload || payload.success !== true) {
        throw new Error(payload && payload.code || 'server');
      }
      return payload;
    }

    function handleError(view, error) {
      if (error.message === 'unauthorized') lockApp('unauthorized');
      else notice(view, error.message, 'error');
    }

    function normalizeId(value) {
      return String(value ?? '')
        .replace(/[\u200B-\u200F\u202A-\u202E\u2066-\u2069\uFEFF]/g, '')
        .trim().toUpperCase();
    }

    function idFromQr(value) {
      const raw = normalizeId(value);
      if (idPattern.test(raw)) return raw;
      if (!raw || raw.length > 4096) return '';
      let decoded = raw;
      try { decoded = decodeURIComponent(raw).toUpperCase(); } catch (error) { /* Use original text. */ }
      const candidates = new Set();
      const pattern = /(?:^|[^A-Z0-9_-])(NOV\d{4,}|SHAM-N\d{3,})(?![A-Z0-9_-])/g;
      for (const match of decoded.matchAll(pattern)) candidates.add(match[1]);
      return candidates.size === 1 ? candidates.values().next().value : '';
    }

    function renderPerson(person, forDelivery = false) {
      const card = element('article', null, 'person');
      const header = element('div', null, 'person-header');
      const heading = element('h2', person.name || '—');
      heading.dir = 'auto';
      const status = element('span', t(person.status), 'pill');
      status.dataset.status = person.status;
      header.append(heading, status);
      const details = element('dl', null, 'details');
      for (const field of ['id', 'partner', 'phone', 'members', 'address']) {
        const group = element('div');
        const value = element('dd');
        const text = element('bdi', person[field] || '—');
        if (['id', 'phone', 'members'].includes(field)) text.dir = 'ltr';
        value.append(text);
        group.append(element('dt', t(field)), value);
        details.append(group);
      }
      card.append(header, details);
      if (forDelivery && person.status === 'pending') {
        const button = element('button', t('confirm'), 'button delivery-button');
        button.type = 'button';
        button.disabled = deliveryBusy;
        button.addEventListener('click', confirmDelivery);
        card.append(button);
      }
      return card;
    }

    function renderDelivery() {
      $('delivery-result').replaceChildren(...(currentPerson ? [renderPerson(currentPerson, true)] : []));
      $('lookup-button').disabled = deliveryBusy;
      $('manual-id').disabled = deliveryBusy;
      $('scan-button').disabled = deliveryBusy || camera !== null;
    }

    async function lookupPerson(id) {
      if (deliveryBusy) return;
      currentPerson = null;
      if (!idPattern.test(id)) {
        renderDelivery();
        notice('delivery', 'invalid_id', 'error');
        return;
      }
      const startedIn = session;
      deliveryBusy = true;
      renderDelivery();
      stopCamera();
      notice('delivery', 'loading');
      try {
        const result = await api('person', {id});
        if (startedIn !== session) return;
        currentPerson = result.person;
        notice('delivery');
      } catch (error) {
        if (startedIn === session) handleError('delivery', error);
      } finally {
        if (startedIn === session) {
          deliveryBusy = false;
          renderDelivery();
        }
      }
    }

    async function confirmDelivery() {
      if (deliveryBusy || currentPerson?.status !== 'pending') return;
      const id = currentPerson.id;
      const startedIn = session;
      deliveryBusy = true;
      renderDelivery();
      notice('delivery', 'loading');
      try {
        const result = await api('deliver', {id});
        if (startedIn !== session) return;
        currentPerson = result.person;
        if (searchState) {
          searchState.results = searchState.results.map(person => person.id === id ? result.person : person);
          renderSearch();
        }
        notice('delivery', result.alreadyDelivered ? 'already' : 'saved');
        if (activeView === 'stats') loadStats();
      } catch (error) {
        if (startedIn === session) handleError('delivery', error);
      } finally {
        if (startedIn === session) {
          deliveryBusy = false;
          renderDelivery();
        }
      }
    }

    async function startCamera() {
      if (camera || deliveryBusy || activeView !== 'delivery') return;
      if (!window.isSecureContext) return notice('delivery', 'cameraContext', 'error');
      if (typeof Html5Qrcode !== 'function') return notice('delivery', 'cameraLibrary', 'error');
      currentPerson = null;
      const run = {reader: new Html5Qrcode('reader'), cancelled: false, captured: false, started: false};
      camera = run;
      renderDelivery();
      $('camera-box').hidden = false;
      notice('delivery', 'startingCamera');
      try {
        run.start = run.reader.start({facingMode: 'environment'}, {fps: 10}, value => {
          if (run.cancelled || run.captured || activeView !== 'delivery') return;
          run.captured = true;
          const id = idFromQr(value);
          stopCamera();
          if (!id) {
            notice('delivery', 'invalid_qr', 'error');
            return;
          }
          $('manual-id').value = id;
          lookupPerson(id);
        });
        await run.start;
        run.started = true;
        if (!run.cancelled) notice('delivery', 'scanHint');
      } catch (error) {
        if (!run.cancelled) {
          stopCamera();
          notice('delivery', 'cameraError', 'error');
        }
      }
    }

    async function stopCamera() {
      const run = camera;
      if (!run || run.cancelled) return;
      run.cancelled = true;
      $('camera-box').hidden = true;
      try {
        if (run.start) await run.start;
        if (run.started) await run.reader.stop();
      } catch (error) {
        const video = $('reader').querySelector('video');
        video?.srcObject?.getTracks().forEach(track => track.stop());
      } finally {
        try { run.reader.clear(); } catch (error) { $('reader').replaceChildren(); }
        camera = null;
        $('scan-button').disabled = deliveryBusy;
      }
    }

    function renderSearch() {
      $('search-button').disabled = searchBusy;
      $('search-results').replaceChildren(...(searchState ? searchState.results.map(person => renderPerson(person)) : []));
      $('pagination').hidden = !searchState || searchState.pages <= 1;
      if (!searchState) return;
      $('page-number').textContent = searchState.page + ' / ' + searchState.pages;
      $('prev-page').disabled = searchBusy || searchState.page <= 1;
      $('next-page').disabled = searchBusy || searchState.page >= searchState.pages;
    }

    async function loadSearch(page) {
      if (searchBusy) return;
      const startedIn = session;
      searchBusy = true;
      renderSearch();
      notice('search', 'loading');
      try {
        const result = await api('search', {query, page});
        if (startedIn !== session) return;
        searchState = result;
        notice('search', result.total ? 'count' : 'noResults', '', result.total || '');
      } catch (error) {
        if (startedIn === session) handleError('search', error);
      } finally {
        if (startedIn === session) {
          searchBusy = false;
          renderSearch();
        }
      }
    }

    function renderStats() {
      $('refresh').disabled = statsBusy;
      $('stats-content').hidden = !currentStats;
      if (!currentStats) return;
      const fields = ['total', 'delivered', 'pending'];
      if (currentStats.unknown) fields.push('unknown');
      $('stats-grid').replaceChildren(...fields.map(field => {
        const item = element('div', null, 'metric');
        item.append(element('span', t(field)), element('strong', currentStats[field]));
        return item;
      }));
      $('delivery-progress').value = currentStats.percent;
      $('stats-percent').textContent = currentStats.percent + '%';
    }

    async function loadStats() {
      if (statsBusy) return;
      const startedIn = session;
      statsBusy = true;
      renderStats();
      notice('stats', 'loading');
      try {
        const result = await api('stats');
        if (startedIn !== session) return;
        currentStats = result.stats;
        notice('stats');
      } catch (error) {
        if (startedIn === session) handleError('stats', error);
      } finally {
        if (startedIn === session) {
          statsBusy = false;
          renderStats();
        }
      }
    }

    function navigate(view) {
      activeView = view;
      if (view !== 'delivery') {
        if (camera && !camera.cancelled) notice('delivery');
        stopCamera();
      }
      views.forEach(id => { $(id).hidden = id !== view; });
      document.querySelectorAll('[data-view]').forEach(button => {
        if (button.dataset.view === view) button.setAttribute('aria-current', 'page');
        else button.removeAttribute('aria-current');
      });
      if (view === 'stats') loadStats();
    }

    $('access').addEventListener('cancel', event => event.preventDefault());
    $('key-form').addEventListener('submit', async event => {
      event.preventDefault();
      if ($('unlock').disabled) return;
      const supplied = $('access-key').value.trim();
      $('unlock').disabled = true;
      notice('access', 'loading');
      try {
        await api('access', {}, supplied);
        key = supplied;
        $('access-key').value = '';
        $('access').close();
        notice('access');
        navigate('delivery');
        $('manual-id').focus();
      } catch (error) {
        notice('access', error.message, 'error');
      } finally {
        $('unlock').disabled = false;
      }
    });
    $('language').addEventListener('click', () => {
      language = language === 'ar' ? 'en' : 'ar';
      applyLanguage();
    });
    $('lock').addEventListener('click', () => lockApp());
    document.querySelectorAll('[data-view]').forEach(button => {
      button.addEventListener('click', () => navigate(button.dataset.view));
    });
    $('lookup-form').addEventListener('submit', event => {
      event.preventDefault();
      stopCamera();
      const id = normalizeId($('manual-id').value);
      $('manual-id').value = id;
      lookupPerson(id);
    });
    $('manual-id').addEventListener('input', () => {
      if (currentPerson) {
        currentPerson = null;
        renderDelivery();
        notice('delivery');
      }
    });
    $('scan-button').addEventListener('click', startCamera);
    $('stop-scan').addEventListener('click', () => {
      stopCamera();
      notice('delivery');
      $('manual-id').focus();
    });
    $('search-form').addEventListener('submit', event => {
      event.preventDefault();
      if (searchBusy) return;
      query = $('search-query').value.trim();
      searchState = null;
      loadSearch(1);
    });
    $('prev-page').addEventListener('click', () => loadSearch(searchState.page - 1));
    $('next-page').addEventListener('click', () => loadSearch(searchState.page + 1));
    $('refresh').addEventListener('click', loadStats);
    window.addEventListener('pagehide', stopCamera);
    applyLanguage();
    startWelcome();
  </script>
